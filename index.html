<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una invitación para ti 💌</title>
<style>
:root{--bg1:#ffe3ec;--bg2:#fff3e6;--card:#ffffffee;--ink:#4a2a38;--soft:#a35d78;--pink:#ff5c8a;--pink2:#ff8fb1;--line:#ffc2d4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1420;--bg2:#1f1a2e;--card:#3a2030ee;--ink:#ffe9f0;--soft:#ffb3cb;--line:#6b3a52}}
:root[data-theme="dark"]{--bg1:#2a1420;--bg2:#1f1a2e;--card:#3a2030ee;--ink:#ffe9f0;--soft:#ffb3cb;--line:#6b3a52}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden}
.card{width:100%;max-width:420px;background:var(--card);border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 12px 40px #ff5c8a33;position:relative;z-index:2;animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.big{font-size:64px;line-height:1;animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
h1{font-size:25px;margin:14px 0 6px}
p{color:var(--soft);margin:0 0 18px;font-size:16px}
.btn{border:0;border-radius:999px;padding:14px 26px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s}
.btn:active{transform:scale(.95)}
.yes{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;box-shadow:0 6px 18px #ff5c8a66}
.no{background:transparent;color:var(--soft);border:2px solid var(--line)}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:56px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.opt{background:transparent;border:2px solid var(--line);border-radius:18px;padding:12px 6px;font-size:15px;color:var(--ink);cursor:pointer;font-family:inherit}
.opt span{display:block;font-size:30px}
.opt.sel{border-color:var(--pink);background:#ff5c8a22;transform:scale(1.04)}
label{display:block;text-align:left;font-size:14px;color:var(--soft);margin:12px 0 4px;font-weight:700}
input[type=date],input[type=time],input[type=text]{width:100%;padding:12px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);font-size:16px;font-family:inherit}
.sum{text-align:left;background:#ff5c8a14;border-radius:18px;padding:14px 16px;margin-bottom:18px;line-height:1.7;color:var(--ink)}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--pink)}
.heart{position:fixed;bottom:-30px;font-size:22px;opacity:.7;animation:up linear forwards;z-index:1;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.err{color:#d6336c;font-size:14px;min-height:20px;margin:-8px 0 8px}
.cat{width:150px;height:150px;object-fit:cover;border-radius:50%;border:4px solid var(--line);box-shadow:0 6px 18px #ff5c8a44;display:block;margin:0 auto}
</style>
</head>

function cat(k){return '<img class="cat" alt="gatito" src="'+CATS[k]+'">'}
var S={step:0,food:'',date:'',time:'',pick:'',addr:'',noCount:0};
var app=document.getElementById('app');

function dots(){var h='<div class="dots">';for(var i=1;i<=4;i++)h+='<i class="'+(S.step>=i?'on':'')+'"></i>';return h+'</div>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function render(){
 var h='';
 if(S.step===-1){
  h='<div class="big">💌</div><h1>Crea tu invitación</h1><p>Llena los datos y envíale el link</p>'+
  '<label>Nombre de ella</label><input type="text" id="c1" placeholder="Ej: Laura">'+
  '<label>Tu nombre</label><input type="text" id="c2" value="Daner">'+
  '<label>Tu WhatsApp (con indicativo, sin +)</label><input type="text" id="c3" inputmode="numeric" placeholder="573001234567">'+
  '<div class="err" id="err" style="margin-top:10px"></div><button class="btn yes" id="gen">Crear link 💘</button><div id="res"></div>';
 }else if(S.step===0){
  h='<div class="big" id="catbox">'+cat('beg')+'</div><h1>Hola'+(PARA?', '+esc(PARA):'')+' 💕</h1><p>'+esc(DE)+' tiene una pregunta muy importante para ti…<br><b>¿Quieres salir conmigo?</b></p>'+
  '<div class="row" id="row"><button class="btn yes" id="yes">¡Sí! 💖</button><button class="btn no" id="no">No 🙈</button></div>';
 }else if(S.step===1){
  h=dots()+'<div class="big">'+cat('wow')+'</div><h1>¡Qué felicidad!</h1><p>¿Qué se te antoja comer?</p><div class="grid">'+
  FOODS.map(function(f){return '<button class="opt'+(S.food===f[1]?' sel':'')+'" data-f="'+f[1]+'"><span>'+f[0]+'</span>'+f[1]+'</button>'}).join('')+
  '</div><div class="err" id="err"></div><button class="btn yes" id="next">Siguiente</button>';
 }else if(S.step===2){
  h=dots()+'<div class="big">📅</div><h1>¿Cuándo?</h1><p>Elige el día y la hora que mejor te quede</p>'+
  '<label>Fecha</label><input type="date" id="d" value="'+S.date+'">'+
  '<label>Hora</label><input type="time" id="t" value="'+S.time+'"><div class="err" id="err" style="margin-top:10px"></div>'+
  '<button class="btn yes" id="next">Siguiente</button>';
 }else if(S.step===3){
  h=dots()+'<div class="big">🚗</div><h1>¿Te recojo?</h1><p>Me encantaría pasar por ti</p>'+
  '<div class="grid"><button class="opt'+(S.pick==='si'?' sel':'')+'" data-p="si"><span>🚗</span>Sí, recógeme</button>'+
  '<button class="opt'+(S.pick==='no'?' sel':'')+'" data-p="no"><span>📍</span>Nos vemos allá</button></div>'+
  (S.pick==='si'?'<label>¿Dónde te recojo?</label><input type="text" id="a" placeholder="Dirección o referencia" value="'+esc(S.addr)+'">':'')+
  '<div class="err" id="err" style="margin-top:10px"></div><button class="btn yes" id="next">Ver resumen</button>';
 }else{
  var f=S.date.split('-'),fecha=new Date(f[0],f[1]-1,f[2]).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
  h='<div class="big">'+cat('beg')+'</div><h1>¡Es una cita!</h1><p>Esto es lo que quedó:</p><div class="sum">'+
  '🍽️ <b>'+esc(S.food)+'</b><br>📅 <b>'+esc(fecha)+'</b><br>🕒 <b>'+esc(S.time)+'</b><br>'+
  (S.pick==='si'?'🚗 Te recojo en <b>'+esc(S.addr||'donde me digas')+'</b>':'📍 Nos vemos en el lugar')+'</div>'+
  '<button class="btn yes" id="send">Avisarle a '+esc(DE)+' por WhatsApp 💬</button>';
 }
 app.innerHTML=h;bind();
}

function err(m){var e=document.getElementById('err');if(e)e.textContent=m}

function bind(){
 var $=function(i){return document.getElementById(i)};
 if(S.step===-1){
  $('gen').onclick=function(){
   var n=$('c1').value.trim(),d=$('c2').value.trim()||'Daner',t=$('c3').value.replace(/\D/g,'');
   if(!n)return err('Escribe su nombre 💕');
   if(t.length<10)return err('Revisa tu número (ej: 573001234567)');
   var link=location.origin+location.pathname+'?para='+encodeURIComponent(n)+'&de='+encodeURIComponent(d)+'&tel='+t;
   var wa='https://wa.me/?text='+encodeURIComponent('Tengo algo para ti 💌 '+link);
   err('');
   $('res').innerHTML='<label style="margin-top:18px">Tu link listo:</label><input type="text" id="lk" readonly value="'+esc(link)+'">'+
    '<div class="row" style="margin-top:14px"><button class="btn yes" id="cp">Copiar 📋</button><a class="btn no" style="text-decoration:none" href="'+esc(wa)+'">Enviar por WhatsApp</a></div>'+
    '<p style="margin:14px 0 0"><a href="'+esc(link)+'" style="color:var(--pink);font-weight:700">Probar cómo se ve →</a></p>';
   $('cp').onclick=function(){
    var i=$('lk');i.select();i.setSelectionRange(0,999);
    var ok=function(){$('cp').textContent='¡Copiado! ✅'};
    try{navigator.clipboard.writeText(link).then(ok,function(){document.execCommand('copy');ok()})}catch(e){try{document.execCommand('copy');ok()}catch(e2){}}
   };
  };
 }
 if(S.step===0){
  $('yes').onclick=function(){S.step=1;burst();render()};
  var no=$('no');
  var dodge=function(e){
   if(e&&e.preventDefault)e.preventDefault();
   S.noCount++;if(S.noCount===2&&$('catbox'))$('catbox').innerHTML=cat('judge');
   var labels=['¿Segura? 🥺','Piénsalo bien 💭','Ándale, di que sí 🥹','El botón se está cansando 😅','Mejor di que sí 💖'];
   no.textContent=labels[Math.min(S.noCount-1,labels.length-1)];
   no.style.position='fixed';
   no.style.left=Math.max(8,Math.random()*(window.innerWidth-150))+'px';
   no.style.top=Math.max(8,Math.random()*(window.innerHeight-60))+'px';
   var y=$('yes');y.style.transform='scale('+Math.min(1+S.noCount*.12,1.8)+')';
  };
  no.addEventListener('pointerenter',dodge);no.addEventListener('touchstart',dodge,{passive:false});no.onclick=dodge;
 }
 if(S.step===1){
  document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){S.food=b.dataset.f;render()}});
  $('next').onclick=function(){if(!S.food)return err('Elige algo rico 🍽️');S.step=2;render()};
 }
 if(S.step===2){
  var d=$('d');d.min=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  $('next').onclick=function(){S.date=$('d').value;S.time=$('t').value;
   if(!S.date||!S.time)return err('Falta elegir fecha y hora 📅');S.step=3;render()};
 }
 if(S.step===3){
  document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){var a=$('a');if(a)S.addr=a.value;S.pick=b.dataset.p;render()}});
  $('next').onclick=function(){var a=$('a');if(a)S.addr=a.value;
   if(!S.pick)return err('Cuéntame si te recojo 🚗');
   if(S.pick==='si'&&!S.addr.trim())return err('¿Dónde te recojo?');S.step=4;burst();render()};
 }
 if(S.step===4){
  $('send').onclick=function(){
   var f=S.date.split('-'),fecha=new Date(f[0],f[1]-1,f[2]).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
   var m='¡Dije que SÍ! 💖\n🍽️ '+S.food+'\n📅 '+fecha+'\n🕒 '+S.time+'\n'+(S.pick==='si'?'🚗 Recógeme en: '+S.addr:'📍 Nos vemos allá');
   window.location.href='https://wa.me/'+TEL+'?text='+encodeURIComponent(m);
  };
 }
}

function burst(){
 var e=['💖','💗','💕','🌸','✨','💘'];
 for(var i=0;i<22;i++){(function(i){setTimeout(function(){
  var s=document.createElement('span');s.className='heart';s.textContent=e[i%e.length];
  s.style.left=Math.random()*100+'vw';s.style.fontSize=(16+Math.random()*22)+'px';
  s.style.animationDuration=(3+Math.random()*3)+'s';document.body.appendChild(s);
  setTimeout(function(){s.remove()},6500)},i*90)})(i)}
}
render();
</script>
